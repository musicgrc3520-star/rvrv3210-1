<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成迷宮 (終點死巷無岔路版)</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #1a1a24; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: #fff; 
            user-select: none; 
            position: relative;
        }

        #main-action-bar { 
            width: 90%;
            max-width: 800px;
            margin-bottom: 12px; 
            display: flex; 
            justify-content: flex-start; 
            gap: 10px; 
        }

        button { 
            font-weight: bold; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        
        button:disabled { 
            background: #444 !important; 
            color: #888 !important; 
            cursor: not-allowed; 
            opacity: 0.6;
        }

        #settingsToggleBtn { background: #6c757d; color: #fff; }
        #playBtn { background: #00ff88; color: #111; }
        #playBtn.playing-mode { background: #ee5253; color: #fff; }
        #downloadBtn { background: #00a8ff; color: #fff; }
        #genBtn { background: #00ff88; color: #111; }
        #ansBtn { background: #ffdd59; color: #111; }

        #control-panel { 
            background: rgba(30, 33, 41, 0.98); 
            padding: 16px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            border: 1px solid #4a4a5a; 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            z-index: 100; 
            width: 340px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        #control-panel.hidden { display: none !important; }

        .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
        .inputs { display: flex; gap: 4px; align-items: center; }
        
        input[type="number"], select { 
            padding: 4px 6px; 
            border-radius: 4px; 
            border: 1px solid #555; 
            background: #2b2b36; 
            color: #fff; 
            font-weight: bold; 
            font-size: 13px; 
            text-align: center; 
        }
        input[type="number"] { width: 48px; }
        input[type="color"] { border: none; width: 30px; height: 26px; cursor: pointer; background: transparent; }

        #genSpeedRow.hidden { display: none !important; }

        #maze-wrapper { background: #0e0e12; padding: 10px; border-radius: 8px; border: 2px solid #3a3a4a; }
        canvas { display: block; background: #000; }
        #hud { margin-top: 15px; background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 6px; color: #00ff88; font-family: monospace; font-size: 16px; border: 1px solid #00ff88; text-align: center; }
        .status-text { font-size: 13px; color: #ffbc00; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="main-action-bar">
        <button id="settingsToggleBtn">⚙️ 設定</button>
        <button id="playBtn" disabled>🎮 開始遊玩</button>
        <button id="downloadBtn" disabled>💾 下載圖片</button>
    </div>

    <div id="control-panel">
        <div class="row">
            <label>迷宮模式:</label>
            <div class="inputs">
                <select id="modeSelect">
                    <option value="line" selected>線條模式 (Thin Wall)</option>
                    <option value="solid">實心模式 (Block Grid)</option>
                </select>
            </div>
        </div>
        <div class="row"><label>迷宮尺寸 X & Y:</label><div class="inputs"><input type="number" id="widthInput" value="20" min="3" max="251"><span>x</span><input type="number" id="heightInput" value="20" min="3" max="251"></div></div>
        
        <div class="row id-gen-speed hidden" id="genSpeedRow">
            <label>生成速度(1~101):</label>
            <div class="inputs"><input type="number" id="genSpeedInput" value="80" min="1" max="101"></div>
        </div>
        
        <div class="row"><label>解答速度(1~101):</label><div class="inputs"><input type="number" id="ansSpeedInput" value="50" min="1" max="101"></div></div>
        
        <hr style="border: 0.5px solid #3a3a4a; width: 100%; margin: 4px 0;">

        <!-- 顏色選擇設定 -->
        <div class="row"><label>牆壁顏色:</label><input type="color" id="wallColorInput" value="#393c51"></div>
        <div class="row"><label>通道/背景顏色:</label><input type="color" id="bgColorInput" value="#000000"></div>
        <div class="row"><label>起點顏色:</label><input type="color" id="startColorInput" value="#10B981"></div>
        <div class="row"><label>終點顏色:</label><input type="color" id="endColorInput" value="#EF4444"></div>

        <hr style="border: 0.5px solid #3a3a4a; width: 100%; margin: 4px 0;">

        <div class="row">
            <label>起點 (X, Y):</label>
            <div class="inputs">
                <select id="startPresetSelect">
                    <option value="custom">自訂</option>
                    <option value="top-left" selected>左上</option>
                    <option value="top-right">右上</option>
                    <option value="bottom-left">左下</option>
                    <option value="bottom-right">右下</option>
                    <option value="center">中間</option>
                    <option value="top-center">上中</option>
                    <option value="bottom-center">下中</option>
                    <option value="left-center">左中</option>
                    <option value="right-center">右中</option>
                </select>
                <input type="number" id="startXInput" value="0"><span>,</span><input type="number" id="startYInput" value="0">
            </div>
        </div>

        <div class="row">
            <label>終點 (X, Y):</label>
            <div class="inputs">
                <select id="endPresetSelect">
                    <option value="custom">自訂</option>
                    <option value="top-left">左上</option>
                    <option value="top-right">右上</option>
                    <option value="bottom-left">左下</option>
                    <option value="bottom-right" selected>右下</option>
                    <option value="center">中間</option>
                    <option value="top-center">上中</option>
                    <option value="bottom-center">下中</option>
                    <option value="left-center">左中</option>
                    <option value="right-center">右中</option>
                </select>
                <input type="number" id="endXInput" value="19"><span>,</span><input type="number" id="endYInput" value="19">
            </div>
        </div>

        <div style="display:flex; gap:10px; justify-content:center; margin-top:8px;">
            <button id="genBtn">重新生成</button>
            <button id="ansBtn" disabled>顯示答案</button>
        </div>
    </div>

    <div id="maze-wrapper"><canvas id="mazeCanvas"></canvas></div>
    <div id="hud">
        <div id="statusLabel" class="status-text">準備就緒</div>
        歡迎來到 rvrv3210 網
    </div>

    <script>
    (function() {
        window.mazeEngine = {
            mode: 'line',
            hWalls: null,
            vWalls: null,
            gridGrid: null,
            gridW: 20,
            gridH: 20,
            startX: 0,
            startY: 0,
            endX: 19,
            endY: 19,
            playerX: 0,
            playerY: 0,
            isPlaying: false,
            playerPath: [],
            solutionPath: [],
            activeKeys: new Set(),
            keyTimer: null,
            
            init: function() {
                this.canvas = document.getElementById('mazeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.bindEvents();
                this.updateModeUI();
            },

            bindEvents: function() {
                const self = this;

                window.addEventListener('keydown', (e) => {
                    if (!self.isPlaying) return;
                    if (['KeyW', 'ArrowUp', 'KeyS', 'ArrowDown', 'KeyA', 'ArrowLeft', 'KeyD', 'ArrowRight'].includes(e.code)) {
                        e.preventDefault();
                        if (!self.activeKeys.has(e.code)) {
                            self.activeKeys.clear();
                            self.activeKeys.add(e.code);
                            self.startContinuousMove();
                        }
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (['KeyW', 'ArrowUp', 'KeyS', 'ArrowDown', 'KeyA', 'ArrowLeft', 'KeyD', 'ArrowRight'].includes(e.code)) {
                        self.activeKeys.delete(e.code);
                        if (self.activeKeys.size === 0) {
                            clearInterval(self.keyTimer);
                            self.keyTimer = null;
                        }
                    }
                });

                document.getElementById('settingsToggleBtn').onclick = () => {
                    if (!self.isPlaying) document.getElementById('control-panel').classList.toggle('hidden');
                };

                document.getElementById('playBtn').onclick = () => self.togglePlay();

                document.getElementById('downloadBtn').onclick = () => {
                    const a = document.createElement('a');
                    a.href = self.canvas.toDataURL();
                    a.download = `maze_${self.gridW}x${self.gridH}.png`;
                    a.click();
                };

                document.getElementById('modeSelect').addEventListener('change', (e) => {
                    self.updateModeUI();
                });

                ['widthInput', 'heightInput'].forEach(id => {
                    let el = document.getElementById(id);
                    if (el) el.addEventListener('input', () => {
                        if (document.getElementById('modeSelect').value === 'solid') {
                            self.enforceOddDimensions();
                        }
                        self.applyPreset('start'); 
                        self.applyPreset('end'); 
                    });
                });

                ['start', 'end'].forEach(t => {
                    let el = document.getElementById(t + 'PresetSelect');
                    if (el) el.addEventListener('change', () => {
                        self.applyPreset(t);
                        self.syncPresetOptions();
                    });
                });

                ['startXInput', 'startYInput', 'endXInput', 'endYInput'].forEach(id => {
                    let el = document.getElementById(id);
                    if (el) el.addEventListener('input', () => {
                        self.checkIfCustomCoord();
                        self.syncPresetOptions();
                    });
                });

                ['wallColorInput', 'bgColorInput', 'startColorInput', 'endColorInput'].forEach(id => {
                    let el = document.getElementById(id);
                    if (el) el.addEventListener('input', () => self.draw());
                });
            },

            updateModeUI: function() {
                const mode = document.getElementById('modeSelect').value;
                const genSpeedRow = document.getElementById('genSpeedRow');
                
                if (mode === 'solid') {
                    genSpeedRow.classList.remove('hidden');
                    this.enforceOddDimensions();
                } else {
                    genSpeedRow.classList.add('hidden');
                }
                this.applyPreset('start');
                this.applyPreset('end');
                this.syncPresetOptions();
            },

            enforceOddDimensions: function() {
                ['widthInput', 'heightInput'].forEach(id => {
                    let el = document.getElementById(id);
                    let val = parseInt(el.value) || 21;
                    if (val % 2 === 0) {
                        el.value = val + 1;
                    }
                });
            },

            getPresetCoords: function(sel, w, h) {
                const isSolid = document.getElementById('modeSelect').value === 'solid';
                
                let minX = isSolid ? 1 : 0;
                let minY = isSolid ? 1 : 0;
                let maxX = isSolid ? w - 2 : w - 1;
                let maxY = isSolid ? h - 2 : h - 1;

                let x = minX, y = minY;
                const makeOdd = (v) => (isSolid && v % 2 === 0) ? v - 1 : v;

                if (sel === 'top-left') { x = minX; y = minY; }
                else if (sel === 'top-right') { x = maxX; y = minY; }
                else if (sel === 'bottom-left') { x = minX; y = maxY; }
                else if (sel === 'bottom-right') { x = maxX; y = maxY; }
                else if (sel === 'center') { x = makeOdd(Math.floor(w / 2)); y = makeOdd(Math.floor(h / 2)); }
                else if (sel === 'top-center') { x = makeOdd(Math.floor(w / 2)); y = minY; }
                else if (sel === 'bottom-center') { x = makeOdd(Math.floor(w / 2)); y = maxY; }
                else if (sel === 'left-center') { x = minX; y = makeOdd(Math.floor(h / 2)); }
                else if (sel === 'right-center') { x = maxX; y = makeOdd(Math.floor(h / 2)); }
                
                return { x, y };
            },

            applyPreset: function(type) {
                let w = parseInt(document.getElementById('widthInput').value) || 20;
                let h = parseInt(document.getElementById('heightInput').value) || 20;
                let sel = document.getElementById(type + 'PresetSelect').value;
                if (sel === 'custom') return;

                let coords = this.getPresetCoords(sel, w, h);
                document.getElementById(type + 'XInput').value = coords.x;
                document.getElementById(type + 'YInput').value = coords.y;
            },

            checkIfCustomCoord: function() {
                let w = parseInt(document.getElementById('widthInput').value) || 20;
                let h = parseInt(document.getElementById('heightInput').value) || 20;

                ['start', 'end'].forEach(type => {
                    let selEl = document.getElementById(type + 'PresetSelect');
                    let currSel = selEl.value;
                    if (currSel === 'custom') return;

                    let curX = parseInt(document.getElementById(type + 'XInput').value);
                    let curY = parseInt(document.getElementById(type + 'YInput').value);
                    let target = this.getPresetCoords(currSel, w, h);

                    if (curX !== target.x || curY !== target.y) {
                        selEl.value = 'custom';
                    }
                });
            },

            syncPresetOptions: function() {
                let startSel = document.getElementById('startPresetSelect').value;
                let endSel = document.getElementById('endPresetSelect').value;

                Array.from(document.getElementById('endPresetSelect').options).forEach(opt => {
                    if (opt.value !== 'custom' && opt.value === startSel) opt.disabled = true;
                    else opt.disabled = false;
                });

                Array.from(document.getElementById('startPresetSelect').options).forEach(opt => {
                    if (opt.value !== 'custom' && opt.value === endSel) opt.disabled = true;
                    else opt.disabled = false;
                });
            },

            setMazeData: function(mode, w, h, sx, sy, ex, ey, hwJson, vwJson, gridJson, solJson) {
                this.mode = mode;
                this.gridW = w;
                this.gridH = h;
                this.startX = sx;
                this.startY = sy;
                this.endX = ex;
                this.endY = ey;

                if (mode === 'line') {
                    this.hWalls = JSON.parse(hwJson);
                    this.vWalls = JSON.parse(vwJson);
                    this.gridGrid = null;
                } else {
                    this.gridGrid = JSON.parse(gridJson);
                    this.hWalls = null;
                    this.vWalls = null;
                }
                
                this.solutionPath = JSON.parse(solJson);

                let maxDim = Math.max(w, h);
                let cellSize = Math.max(12, Math.floor(600 / maxDim));
                this.canvas.width = w * cellSize;
                this.canvas.height = h * cellSize;

                this.playerX = sx;
                this.playerY = sy;
                this.playerPath = [{ r: sy, c: sx }];

                this.draw();
            },

            togglePlay: function() {
                this.isPlaying = !this.isPlaying;
                const btn = document.getElementById('playBtn');
                const settingsBtn = document.getElementById('settingsToggleBtn');
                const panel = document.getElementById('control-panel');

                if (this.isPlaying) {
                    btn.innerText = "❌ 結束遊玩";
                    btn.classList.add('playing-mode');
                    panel.classList.add('hidden');
                    settingsBtn.disabled = true;

                    this.playerX = this.startX;
                    this.playerY = this.startY;
                    this.playerPath = [{ r: this.startY, c: this.startX }];
                } else {
                    btn.innerText = "🎮 開始遊玩";
                    btn.classList.remove('playing-mode');
                    settingsBtn.disabled = false;
                    clearInterval(this.keyTimer);
                    this.keyTimer = null;
                }
                this.draw();
            },

            startContinuousMove: function() {
                if (this.keyTimer) clearInterval(this.keyTimer);
                this.moveOnce();
                this.keyTimer = setInterval(() => this.moveOnce(), 80);
            },

            moveOnce: function() {
                if (!this.isPlaying) return;
                let dx = 0, dy = 0;
                if (this.activeKeys.has('KeyW') || this.activeKeys.has('ArrowUp')) dy = -1;
                else if (this.activeKeys.has('KeyS') || this.activeKeys.has('ArrowDown')) dy = 1;
                else if (this.activeKeys.has('KeyA') || this.activeKeys.has('ArrowLeft')) dx = -1;
                else if (this.activeKeys.has('KeyD') || this.activeKeys.has('ArrowRight')) dx = 1;

                if (dx !== 0 || dy !== 0) {
                    this.tryMove(dx, dy);
                }
            },

            canMove: function(x, y, dx, dy) {
                let nx = x + dx, ny = y + dy;
                if (nx < 0 || nx >= this.gridW || ny < 0 || ny >= this.gridH) return false;

                if (this.mode === 'line') {
                    if (dy === -1) return !this.hWalls[y][x];
                    if (dy === 1) return !this.hWalls[y + 1][x];
                    if (dx === -1) return !this.vWalls[y][x];
                    if (dx === 1) return !this.vWalls[y][x + 1];
                } else {
                    return this.gridGrid[ny][nx] === 0;
                }
                return false;
            },

            tryMove: function(dx, dy) {
                if (this.canMove(this.playerX, this.playerY, dx, dy)) {
                    this.playerX += dx;
                    this.playerY += dy;
                    this.playerPath.push({ r: this.playerY, c: this.playerX });
                    this.draw();

                    if (this.playerX === this.endX && this.playerY === this.endY) {
                        clearInterval(this.keyTimer);
                        this.keyTimer = null;
                        this.activeKeys.clear();
                        setTimeout(() => alert("🎉 恭喜抵達終點！"), 50);
                    }
                }
            },

            draw: function(overrideAnsPathJson = null, overrideGridJson = null) {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                const cw = w / this.gridW;
                const ch = h / this.gridH;

                const wallColor = document.getElementById('wallColorInput').value;
                const bgColor = document.getElementById('bgColorInput').value;
                const startColor = document.getElementById('startColorInput').value;
                const endColor = document.getElementById('endColorInput').value;

                ctx.clearRect(0, 0, w, h);

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, w, h);

                let activeGrid = this.gridGrid;
                if (overrideGridJson) {
                    try { activeGrid = JSON.parse(overrideGridJson); } catch(e) {}
                }

                if (this.mode === 'solid' && activeGrid) {
                    ctx.fillStyle = wallColor;
                    for (let r = 0; r < this.gridH; r++) {
                        for (let c = 0; c < this.gridW; c++) {
                            if (activeGrid[r][c] === 1) {
                                ctx.fillRect(c * cw, r * ch, cw + 0.5, ch + 0.5);
                            }
                        }
                    }
                }

                ctx.fillStyle = startColor;
                ctx.fillRect(this.startX * cw, this.startY * ch, cw, ch);

                ctx.fillStyle = endColor;
                ctx.fillRect(this.endX * cw, this.endY * ch, cw, ch);

                let drawAns = [];
                if (overrideAnsPathJson) {
                    try {
                        drawAns = typeof overrideAnsPathJson === 'string' ? JSON.parse(overrideAnsPathJson) : overrideAnsPathJson;
                    } catch(e) {}
                }

                if (drawAns.length > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#FFEE00';
                    ctx.lineWidth = Math.max(3, Math.floor(cw * 0.35));
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    drawAns.forEach((p, idx) => {
                        let x = p[1] * cw + cw / 2;
                        let y = p[0] * ch + ch / 2;
                        if (idx === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                }

                if (this.isPlaying && this.playerPath.length > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#06B6D4';
                    ctx.lineWidth = Math.max(3, Math.floor(cw * 0.3));
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    this.playerPath.forEach((p, idx) => {
                        let x = p.c * cw + cw / 2;
                        let y = p.r * ch + ch / 2;
                        if (idx === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();

                    ctx.fillStyle = '#3B82F6';
                    ctx.beginPath();
                    ctx.arc(this.playerX * cw + cw / 2, this.playerY * ch + ch / 2, Math.max(3, cw * 0.3), 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.mode === 'line' && this.hWalls && this.vWalls) {
                    ctx.strokeStyle = wallColor;
                    ctx.lineWidth = Math.max(2, Math.floor(cw * 0.12));
                    ctx.lineCap = 'round';

                    for (let r = 0; r <= this.gridH; r++) {
                        for (let c = 0; c < this.gridW; c++) {
                            if (this.hWalls[r] && this.hWalls[r][c]) {
                                ctx.beginPath();
                                ctx.moveTo(c * cw, r * ch);
                                ctx.lineTo((c + 1) * cw, r * ch);
                                ctx.stroke();
                            }
                        }
                    }

                    for (let r = 0; r < this.gridH; r++) {
                        for (let c = 0; c <= this.gridW; c++) {
                            if (this.vWalls[r] && this.vWalls[r][c]) {
                                ctx.beginPath();
                                ctx.moveTo(c * cw, r * ch);
                                ctx.lineTo(c * cw, (r + 1) * ch);
                                ctx.stroke();
                            }
                        }
                    }
                }
            }
        };

        window.onload = () => window.mazeEngine.init();
    })();

    function setGameStatus(status, text) {
        let statusLabel = document.getElementById('statusLabel');
        if (status === 'generating') {
            if (statusLabel) statusLabel.innerText = "地圖生成中...";
        } else {
            if (statusLabel) statusLabel.innerText = `正解解法占比：${text}`;
        }
    }

    function enableUIButtons() {
        document.getElementById('ansBtn').disabled = false;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('downloadBtn').disabled = false;
    }
    </script>

    <script type="py">
        import random, sys, asyncio, json
        import js
        from pyscript import document
        from js import setGameStatus, enableUIButtons, mazeEngine
        from pyodide.ffi import create_proxy

        sys.setrecursionlimit(200000)

        current_solution_path = []
        is_showing_ans = False

        # --- 線條模式解答 ---
        def solve_line_maze(w, h, h_walls, v_walls, sx, sy, ex, ey):
            q, parent = [(sx, sy)], {(sx, sy): None}
            while q:
                cx, cy = q.pop(0)
                if (cx, cy) == (ex, ey): break
                
                if cy > 0 and not h_walls[cy][cx] and (cx, cy-1) not in parent:
                    parent[(cx, cy-1)] = (cx, cy); q.append((cx, cy-1))
                if cy < h - 1 and not h_walls[cy+1][cx] and (cx, cy+1) not in parent:
                    parent[(cx, cy+1)] = (cx, cy); q.append((cx, cy+1))
                if cx > 0 and not v_walls[cy][cx] and (cx-1, cy) not in parent:
                    parent[(cx-1, cy)] = (cx, cy); q.append((cx-1, cy))
                if cx < w - 1 and not v_walls[cy][cx+1] and (cx+1, cy) not in parent:
                    parent[(cx+1, cy)] = (cx, cy); q.append((cx+1, cy))

            curr, path = (ex, ey), []
            if curr not in parent: return []
            while curr:
                path.append([curr[1], curr[0]])
                curr = parent.get(curr)
            return path[::-1]

        def enforce_line_dead_end(w, h, h_walls, v_walls, sx, sy, ex, ey):
            """ 強制將線條模式的終點改為死巷（只留唯一的入口牆洞） """
            sol = solve_line_maze(w, h, h_walls, v_walls, sx, sy, ex, ey)
            if not sol or len(sol) < 2: return
            
            # 正解路徑倒數第二點 (進入終點的前一格)
            prev_r, prev_c = sol[-2][0], sol[-2][1]

            # 檢查四周四個牆，除了通往 (prev_c, prev_r) 那一面牆補空缺之外，其餘牆壁全部建起來
            # 上牆
            if not (ey - 1 == prev_r and ex == prev_c): h_walls[ey][ex] = True
            # 下牆
            if not (ey + 1 == prev_r and ex == prev_c): h_walls[ey + 1][ex] = True
            # 左牆
            if not (ey == prev_r and ex - 1 == prev_c): v_walls[ey][ex] = True
            # 右牆
            if not (ey == prev_r and ex + 1 == prev_c): v_walls[ey][ex + 1] = True

        def generate_line_maze(w, h, sx, sy, ex, ey):
            h_walls = [[True] * w for _ in range(h + 1)]
            v_walls = [[True] * (w + 1) for _ in range(h)]

            visited = {(sx, sy)}
            stack = [(sx, sy)]

            while stack:
                cx, cy = stack[-1]
                neighbors = []

                if cy > 0 and (cx, cy - 1) not in visited: neighbors.append((cx, cy - 1, 'U'))
                if cy < h - 1 and (cx, cy + 1) not in visited: neighbors.append((cx, cy + 1, 'D'))
                if cx > 0 and (cx - 1, cy) not in visited: neighbors.append((cx - 1, cy, 'L'))
                if cx < w - 1 and (cx + 1, cy) not in visited: neighbors.append((cx + 1, cy, 'R'))

                if neighbors:
                    nx, ny, direction = random.choice(neighbors)
                    if direction == 'U': h_walls[cy][cx] = False
                    elif direction == 'D': h_walls[cy + 1][cx] = False
                    elif direction == 'L': v_walls[cy][cx] = False
                    elif direction == 'R': v_walls[cy][cx + 1] = False

                    visited.add((nx, ny))
                    stack.append((nx, ny))
                else:
                    stack.pop()

            # 強制終點死巷化
            enforce_line_dead_end(w, h, h_walls, v_walls, sx, sy, ex, ey)
            sol = solve_line_maze(w, h, h_walls, v_walls, sx, sy, ex, ey)
            return h_walls, v_walls, sol

        # --- 實心模式解答 ---
        def solve_solid_maze(grid, w, h, sx, sy, ex, ey):
            q, parent = [(sx, sy)], {(sx, sy): None}
            while q:
                cx, cy = q.pop(0)
                if (cx, cy) == (ex, ey): break
                for dx, dy in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
                    nx, ny = cx + dx, cy + dy
                    if 0 <= nx < w and 0 <= ny < h and grid[ny][nx] == 0 and (nx, ny) not in parent:
                        parent[(nx, ny)] = (cx, cy)
                        q.append((nx, ny))

            curr, path = (ex, ey), []
            if curr not in parent: return []
            while curr:
                path.append([curr[1], curr[0]])
                curr = parent.get(curr)
            return path[::-1]

        def enforce_solid_dead_end(grid, w, h, sx, sy, ex, ey):
            """ 強制將實心模式的終點改為死巷 (四周只保留 1 個入口通道) """
            sol = solve_solid_maze(grid, w, h, sx, sy, ex, ey)
            if not sol or len(sol) < 2: return

            prev_r, prev_c = sol[-2][0], sol[-2][1]

            # 遍歷終點四周上下左右，除正解來路外，其餘強制填為牆壁 (1)
            for dx, dy in [(0, -1), (0, 1), (-1, 0), (1, 0)]:
                nx, ny = ex + dx, ey + dy
                if 0 <= nx < w and 0 <= ny < h:
                    if (nx, ny) != (prev_c, prev_r):
                        grid[ny][nx] = 1

            # 重新檢查連通性，避免因為剛剛的封死操作創造出不相連的孤島通道
            q = [(sx, sy)]
            reachable = {(sx, sy)}
            while q:
                cx, cy = q.pop(0)
                for dx, dy in [(0, -1), (0, 1), (-1, 0), (1, 0)]:
                    nx, ny = cx + dx, cy + dy
                    if 0 <= nx < w and 0 <= ny < h and grid[ny][nx] == 0 and (nx, ny) not in reachable:
                        reachable.add((nx, ny))
                        q.append((nx, ny))

            # 打通因封死終點而被斷連的孤島通道
            for r in range(1, h, 2):
                for c in range(1, w, 2):
                    if grid[r][c] == 0 and (c, r) not in reachable:
                        for dx, dy in [(-2, 0), (2, 0), (0, -2), (0, 2)]:
                            nx, ny = c + dx, r + dy
                            if (nx, ny) in reachable:
                                grid[r + dy // 2][c + dx // 2] = 0
                                sub_q = [(c, r)]
                                reachable.add((c, r))
                                while sub_q:
                                    scx, scy = sub_q.pop(0)
                                    for ddx, ddy in [(0, -1), (0, 1), (-1, 0), (1, 0)]:
                                        snx, sny = scx + ddx, scy + ddy
                                        if 0 <= snx < w and 0 <= sny < h and grid[sny][snx] == 0 and (snx, sny) not in reachable:
                                            reachable.add((snx, sny))
                                            sub_q.append((snx, sny))
                                break

        async def generate_solid_maze_animated(w, h, sx, sy, ex, ey, speed):
            grid = [[1] * w for _ in range(h)]
            
            grid[sy][sx] = 0
            grid[ey][ex] = 0

            stack = [(sx, sy)]
            visited = {(sx, sy)}

            delay = 0 if speed >= 101 else max(0.0001, (101 - speed) * 0.0005)
            step_count = 0

            while stack:
                cx, cy = stack[-1]
                neighbors = []

                for dx, dy in [(-2, 0), (2, 0), (0, -2), (0, 2)]:
                    nx, ny = cx + dx, cy + dy
                    if 1 <= nx < w - 1 and 1 <= ny < h - 1 and (nx, ny) not in visited:
                        neighbors.append((nx, ny, cx + dx // 2, cy + dy // 2))

                if neighbors:
                    nx, ny, mx, my = random.choice(neighbors)
                    grid[my][mx] = 0
                    grid[ny][nx] = 0
                    visited.add((nx, ny))
                    stack.append((nx, ny))

                    step_count += 1
                    if speed < 101 and step_count % max(1, speed // 10) == 0:
                        mazeEngine.draw(None, json.dumps(grid))
                        await asyncio.sleep(delay)
                else:
                    stack.pop()

            if (ex, ey) not in visited:
                dirs = [(-2, 0), (2, 0), (0, -2), (0, 2)]
                for dx, dy in dirs:
                    nx, ny = ex + dx, ey + dy
                    if 0 < nx < w - 1 and 0 < ny < h - 1 and grid[ny][nx] == 0:
                        grid[ey + dy // 2][ex + dx // 2] = 0
                        break

            # 強制終點死巷化修復
            enforce_solid_dead_end(grid, w, h, sx, sy, ex, ey)
            sol = solve_solid_maze(grid, w, h, sx, sy, ex, ey)
            return grid, sol

        def parse_coord(id_x, id_y, max_w, max_h, is_solid):
            try:
                el_x = document.querySelector(id_x)
                el_y = document.querySelector(id_y)
                x = int(el_x.value) if el_x else 0
                y = int(el_y.value) if el_y else 0
            except: x, y = 0, 0

            if is_solid:
                x = max(1, min(x, max_w - 2))
                y = max(1, min(y, max_h - 2))
                if x % 2 == 0: x = x - 1 if x > 1 else x + 1
                if y % 2 == 0: y = y - 1 if y > 1 else y + 1
            else:
                x = max(0, min(x, max_w - 1))
                y = max(0, min(y, max_h - 1))
                
            return x, y

        async def generate_maze_animated(event):
            global current_solution_path
            gen_btn = document.querySelector("#genBtn")
            ans_btn = document.querySelector("#ansBtn")
            
            if gen_btn: gen_btn.disabled = True
            if ans_btn: ans_btn.disabled = True
            
            mode = document.querySelector("#modeSelect").value
            is_solid = (mode == 'solid')

            try:
                w_el = document.querySelector("#widthInput")
                h_el = document.querySelector("#heightInput")
                w = int(w_el.value) if w_el else 20
                h = int(h_el.value) if h_el else 20
            except: w, h = 20, 20

            if is_solid:
                w = max(5, w if w % 2 == 1 else w + 1)
                h = max(5, h if h % 2 == 1 else h + 1)
                document.querySelector("#widthInput").value = str(w)
                document.querySelector("#heightInput").value = str(h)
            else:
                w = max(3, w)
                h = max(3, h)

            sx, sy = parse_coord("#startXInput", "#startYInput", w, h, is_solid)
            ex, ey = parse_coord("#endXInput", "#endYInput", w, h, is_solid)

            setGameStatus("generating", "")
            await asyncio.sleep(0.01)

            if mode == 'line':
                h_walls, v_walls, sol = generate_line_maze(w, h, sx, sy, ex, ey)
                current_solution_path = sol
                mazeEngine.setMazeData(mode, w, h, sx, sy, ex, ey, json.dumps(h_walls), json.dumps(v_walls), None, json.dumps(sol))
                total_passages = w * h
            else:
                try:
                    sp_el = document.querySelector("#genSpeedInput")
                    gen_speed = int(sp_el.value) if sp_el else 80
                except: gen_speed = 80

                grid, sol = await generate_solid_maze_animated(w, h, sx, sy, ex, ey, gen_speed)
                current_solution_path = sol
                mazeEngine.setMazeData(mode, w, h, sx, sy, ex, ey, None, None, json.dumps(grid), json.dumps(sol))
                total_passages = sum(row.count(0) for row in grid)

            ratio = (len(sol) / total_passages * 100) if total_passages > 0 else 0
            final_ratio = f"{ratio:.1f}% ({len(sol)}/{total_passages} 格)"

            enableUIButtons()
            setGameStatus("ready", final_ratio)
            
            if gen_btn: gen_btn.disabled = False
            if ans_btn: ans_btn.disabled = False

        async def show_answer_animated(event):
            global is_showing_ans, current_solution_path
            if is_showing_ans or not current_solution_path: return
            
            gen_btn = document.querySelector("#genBtn")
            ans_btn = document.querySelector("#ansBtn")
            
            if gen_btn: gen_btn.disabled = True
            if ans_btn: ans_btn.disabled = True
            is_showing_ans = True

            try:
                ans_sp_el = document.querySelector("#ansSpeedInput")
                ans_speed = int(ans_sp_el.value) if ans_sp_el else 50
            except: ans_speed = 50

            if ans_speed >= 101:
                mazeEngine.draw(json.dumps(current_solution_path))
            else:
                delay = max(0.001, (101 - ans_speed) * 0.001)
                temp_path = []
                for p in current_solution_path:
                    temp_path.append(p)
                    mazeEngine.draw(json.dumps(temp_path))
                    await asyncio.sleep(delay)

            is_showing_ans = False
            if gen_btn: gen_btn.disabled = False
            if ans_btn: ans_btn.disabled = False

        click_gen_proxy = create_proxy(lambda e: asyncio.ensure_future(generate_maze_animated(e)))
        click_ans_proxy = create_proxy(lambda e: asyncio.ensure_future(show_answer_animated(e)))

        gen_btn = document.querySelector("#genBtn")
        if gen_btn: gen_btn.addEventListener("click", click_gen_proxy)

        ans_btn = document.querySelector("#ansBtn")
        if ans_btn: ans_btn.addEventListener("click", click_ans_proxy)

        asyncio.ensure_future(generate_maze_animated(None))
    </script>
