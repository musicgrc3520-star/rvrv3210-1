<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rvrv3210網站</title>
    <link rel="icon" sizes="400x500" href="loge.jpg">
    <style>
        body{
            background-color: #00b0cb;  
        }
        header{
            text-align:center;
            color:#ffffff;
            background:linear-gradient(to right,
            #ff0000,
            #ff8800,
            #ffff00,
            #00ff00,
            #00ffff,
            #0000ff,
            #aa00aa,
            #0000ff,
            #00ffff,
            #00ff00,
            #ffff00,
            #ff8800,
            #ff0000);
            background-size: 400%;
            white-space: nowrap; 
            overflow: hidden; 
            animation: rainbow 15s linear infinite;            
        }
        main{
            text-align:center;
            background-color: #000;
            color: #fff;
            animation: Black_to_White_to_Black 10s infinite; 
            box-shadow: 10px 10px 10px 0px #777;
        }
        footer{
            background: linear-gradient(to right,#ffffff,#000000);
            text-align:center;
            background-size: 200%;
            animation: Black_and_white 2s infinite; 
                      
        }
        footer button{
            font-size: 25px;
            color: #fff;
            background: linear-gradient(to right,#ff0000,#ff8800,#ffff00,#00ff00,#00ffff,#0000ff,#aa00aa);
            border-radius: 20px;   
            transition: 1s;
            text-align:center;
        }
        footer button:hover{
            color: #000;           
        }
        nav button{
            border-radius: 20px;
            background: linear-gradient(to right,#000000,#ffffff);
            color: #eeff00;
            background-size: 200%;
            transition: 1s;
        }
        nav button:hover{
            font-size: 25px;
            background-position:100%;
            color: #ff0000;
        }
        main button{
            color: #fff;
            background-color: #000;
            border-radius: 20px;
        }
        nav{
            background-color: linear-gradient(to right,#ffffff,#000000);
            animation: Black_to_White_to_Black 2s infinite; 
        }
        main div{
            color: #000;
            background: linear-gradient(to right bottom,#ff0000,#ff8800);
            border: 10px #000 groove;
        }
        b{
            font-size: 35px;
        }
        b img{
            transform: translate(0,4px);
        }
        @keyframes Black_to_White_to_Black{
            0%{
                color: #fff;
                background-color: #000;
            }
            50%{
                color: #000;
                background-color: #fff;
            }
            100%{
                color: #fff;
                background-color: #000;           
            }
        }
        @keyframes rainbow{
            0%{
                background-position:0%
            }
            50%{
                background-position:400%
            }
            100%{
                background-position:800%
            }
        }
        @keyframes Black_and_white{
            0%{
                background-position:0%
            }
            50%{
                background-position:100%
            }
            100%{
                background-position:0%
            }
        }
    </style>
</head>
